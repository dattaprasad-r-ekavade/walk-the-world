name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Boots the production build in headless Chromium (software WebGL) and
    # walks the street engine on the checked-in Rome fixture, offline.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start server
        run: |
          npm run start -- -p 3456 > server.log 2>&1 &
          npx --yes wait-on@8.0.3 --timeout 60000 http://127.0.0.1:3456
      - run: npm run test:e2e -- http://127.0.0.1:3456
      - name: Server log
        if: failure()
        run: cat server.log
